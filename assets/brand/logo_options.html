<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  body { margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
  .row { display: flex; }
  .cell { width: 420px; height: 170px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
  .light { background: #FBF8F3; color: #1B2A41; }
  .dark { background: #0F1724; color: #E8ECF2; }
  .tag { font-size: 13px; font-weight: 700; letter-spacing: .08em; opacity: .55; }
  .word { font-size: 34px; font-weight: 800; letter-spacing: -.02em; }
  .word b { color: #D9822B; font-weight: 800; }
  .dark .word b { color: #F2A541; }
  .lockup { display: flex; align-items: center; gap: 12px; }
</style>
</head>
<body>
<!-- Option A: spyglass rising at an angle (scouting + launch) -->
<!-- Option B: map pin with a lens inside (local + research) -->
<!-- Option C: compass whose needle is an upward arrow (direction + launch) -->
<div class="row">
  <div class="cell light"><div class="tag">A · SPYGLASS</div><div class="lockup">
    <svg width="46" height="46" viewBox="0 0 48 48"><g transform="rotate(-35 24 24)">
      <rect x="6" y="19" width="14" height="10" rx="2" fill="#1B2A41"/><rect x="19" y="17" width="12" height="14" rx="2" fill="#1B2A41"/>
      <rect x="30" y="15" width="12" height="18" rx="3" fill="#D9822B"/></g>
      <circle cx="40" cy="9" r="3" fill="#D9822B"/></svg>
    <div class="word">Launch<b>Scout</b></div></div></div>
  <div class="cell light"><div class="tag">B · PIN + LENS</div><div class="lockup">
    <svg width="46" height="46" viewBox="0 0 48 48"><path d="M24 4c-8.3 0-15 6.5-15 14.6C9 30 24 44 24 44s15-14 15-25.4C39 10.5 32.3 4 24 4z" fill="#1B2A41"/>
      <circle cx="23" cy="18" r="7" fill="none" stroke="#F2A541" stroke-width="3.4"/><path d="M28 23l5 5" stroke="#F2A541" stroke-width="3.4" stroke-linecap="round"/></svg>
    <div class="word">Launch<b>Scout</b></div></div></div>
  <div class="cell light"><div class="tag">C · COMPASS ARROW</div><div class="lockup">
    <svg width="46" height="46" viewBox="0 0 48 48"><circle cx="24" cy="24" r="20" fill="none" stroke="#1B2A41" stroke-width="3.5"/>
      <path d="M24 9l7 17h-14z" fill="#D9822B"/><path d="M17 26h14l-7 13z" fill="#1B2A41"/></svg>
    <div class="word">Launch<b>Scout</b></div></div></div>
</div>
<div class="row">
  <div class="cell dark"><div class="lockup">
    <svg width="46" height="46" viewBox="0 0 48 48"><g transform="rotate(-35 24 24)">
      <rect x="6" y="19" width="14" height="10" rx="2" fill="#E8ECF2"/><rect x="19" y="17" width="12" height="14" rx="2" fill="#E8ECF2"/>
      <rect x="30" y="15" width="12" height="18" rx="3" fill="#F2A541"/></g>
      <circle cx="40" cy="9" r="3" fill="#F2A541"/></svg>
    <div class="word">Launch<b>Scout</b></div></div></div>
  <div class="cell dark"><div class="lockup">
    <svg width="46" height="46" viewBox="0 0 48 48"><path d="M24 4c-8.3 0-15 6.5-15 14.6C9 30 24 44 24 44s15-14 15-25.4C39 10.5 32.3 4 24 4z" fill="#E8ECF2"/>
      <circle cx="23" cy="18" r="7" fill="none" stroke="#D9822B" stroke-width="3.4"/><path d="M28 23l5 5" stroke="#D9822B" stroke-width="3.4" stroke-linecap="round"/></svg>
    <div class="word">Launch<b>Scout</b></div></div></div>
  <div class="cell dark"><div class="lockup">
    <svg width="46" height="46" viewBox="0 0 48 48"><circle cx="24" cy="24" r="20" fill="none" stroke="#E8ECF2" stroke-width="3.5"/>
      <path d="M24 9l7 17h-14z" fill="#F2A541"/><path d="M17 26h14l-7 13z" fill="#E8ECF2"/></svg>
    <div class="word">Launch<b>Scout</b></div></div></div>
</div>
</body>
</html>
